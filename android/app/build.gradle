plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cargonav.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cargonav.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Веб-приложение лежит в ../web и является единым источником для сайта и приложения.
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }
}

dependencies {
    // Выравниваем версии kotlin-stdlib (конфликт 1.8.22 vs jdk7/jdk8 1.6.21 из AndroidX)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
