name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Анализ кода
        run: flutter analyze

      - name: Тесты (маршрутизатор, дальние маршруты, навигация, UI)
        run: flutter test

      - name: Ключ подписи из GitHub Secrets
        env:
          # один секрет: первая строка — пароль, остальное — файл ключа в base64 (см. tools/create-signing-key.sh)
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::Секрет ANDROID_SIGNING_KEY не задан: APK подписан временным ключом и не обновится поверх установленного. См. README, раздел «Ключ подписи»."
            exit 0
          fi
          PASS="$(printf '%s\n' "$SIGNING_KEY" | head -n 1 | tr -d '\r ')"
          echo "::add-mask::$PASS"
          printf '%s\n' "$SIGNING_KEY" | tail -n +2 | tr -d '\r \n' | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$PASS"
            echo "keyAlias=cargonav"
            echo "keyPassword=$PASS"
          } > android/key.properties
          # проверка, что ключ читается этим паролем — иначе сборка упадёт с понятной причиной
          keytool -list -keystore android/app/release.jks -storepass "$PASS" -alias cargonav > /dev/null \
            || { echo "::error::Секрет ANDROID_SIGNING_KEY повреждён или неполон: ключ не открывается."; exit 1; }
          echo "Ключ подписи подключён."

      - name: Сборка APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Подготовить файл для релиза
        run: cp build/app/outputs/flutter-apk/app-release.apk cargo-navigation.apk

      - name: Отпечаток подписи (должен совпадать во всех сборках)
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs cargo-navigation.apk | grep -i "SHA-256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: cargo-navigation-apk
          path: cargo-navigation.apk

      - name: Опубликовать APK в GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          target_commitish: ${{ github.sha }}
          name: Cargo Navigation (последняя сборка)
          body: Android-приложение на Flutter. Для установки разрешите установку из неизвестных источников.
          prerelease: true
          files: cargo-navigation.apk
