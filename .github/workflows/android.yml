name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Тесты маршрутизатора
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Принять лицензии Android SDK (SDK предустановлен на раннере)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Сборка debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: cargo-navigation-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Подготовить файл для релиза
        run: cp android/app/build/outputs/apk/debug/app-debug.apk cargo-navigation.apk

      - name: Опубликовать APK в GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          target_commitish: ${{ github.sha }}
          name: Cargo Navigation (последняя сборка)
          body: Debug-сборка Android-приложения. Установка из неизвестных источников.
          prerelease: true
          files: cargo-navigation.apk
