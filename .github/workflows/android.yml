name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Анализ кода
        run: flutter analyze

      - name: Тесты (маршрутизатор, дальние маршруты, навигация, UI)
        run: flutter test

      - name: Сборка APK
        run: flutter build apk --release

      - name: Подготовить файл для релиза
        run: cp build/app/outputs/flutter-apk/app-release.apk cargo-navigation.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cargo-navigation-apk
          path: cargo-navigation.apk

      - name: Опубликовать APK в GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          target_commitish: ${{ github.sha }}
          name: Cargo Navigation (последняя сборка)
          body: Android-приложение на Flutter. Для установки разрешите установку из неизвестных источников.
          prerelease: true
          files: cargo-navigation.apk
